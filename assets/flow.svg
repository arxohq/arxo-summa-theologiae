<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="446" viewBox="0 0 1280 446" role="img"><title>Argument structure and case application are distinct model layers</title><rect width="1280" height="446" rx="24" fill="#f5f0e6"/><text x="36" y="50" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#162d46">TWO WAYS TO EXPLORE ONE TEXT</text><text x="36" y="88" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#162d46">Argument structure</text><rect x="36" y="100" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="54" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Objections</text><path d="M314 145h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="340" y="100" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="358" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Sed contra</text><path d="M618 145h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="644" y="100" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="662" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Respondeo</text><path d="M922 145h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="948" y="100" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="966" y="151" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Replies to objections</text><text x="36" y="248" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#162d46">Applied model</text><rect x="36" y="260" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="54" y="311" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Pinned rule</text><path d="M314 305h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="340" y="260" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="358" y="311" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Case facts</text><path d="M618 305h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="644" y="260" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="662" y="311" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Human assessment</text><path d="M922 305h16l-5 -5m5 5l-5 5" fill="none" stroke="#986b3f" stroke-width="3"/><rect x="948" y="260" width="268" height="90" rx="14" fill="white" stroke="#d7d5d0"/><text x="966" y="311" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">Answer + proof</text><text x="36" y="409" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">The model records admitted premises. It does not independently establish their theological truth.</text></svg>