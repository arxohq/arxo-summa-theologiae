<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="394" viewBox="0 0 1280 394" role="img"><title>Supplied adjudication and a pending judgment retain different evidence and statuses</title><rect width="1280" height="394" rx="24" fill="#f5f0e6"/><text x="36" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">THE SAME QUESTION: IS THIS DEFENSE PERMITTED?</text><rect x="36" y="92" width="584" height="220" rx="16" fill="white" stroke="#d7d5d0"/><text x="58" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#162d46">Assessment supplied</text><text x="58" y="176" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">vis_moderata: positive, adjudicated</text><text x="58" y="216" font-family="monospace" font-size="21" font-weight="700" fill="#087d62">COMPUTED / TRUE_ONLY</text><text x="58" y="259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">The model can apply DefensioLicitaPrivata.</text><text x="58" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">0 judgment request(s)</text><rect x="660" y="92" width="584" height="220" rx="16" fill="white" stroke="#d7d5d0"/><text x="682" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#162d46">Assessment absent</text><text x="682" y="176" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">No assertion of vis_moderata</text><text x="682" y="216" font-family="monospace" font-size="21" font-weight="700" fill="#986b3f">REQUIRES_JUDGMENT / NEITHER</text><text x="682" y="259" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">The model requests the declared assessment.</text><text x="682" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">1 judgment request(s)</text><text x="36" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">Absence is not a negative judgment. Neither is a request for assessment a refusal of defense.</text></svg>